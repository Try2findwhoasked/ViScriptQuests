[tools]
java = ["temurin-17.0.21+9", "temurin-21.0.13+9.0.LTS"]
gradle = "8.12.1"

[tasks.build]
description = "Build Forge 1.20.1 in the configured ViScript parent workspace"
run = "powershell -NoProfile -File tools/build.ps1"

[tasks.verify]
description = "Run Forge backport regression checks"
run = "powershell -NoProfile -File tools/build.ps1 -Verify"

[tasks."verify:ui"]
description = "Run the AI editor scenario in an isolated client test world"
run = "powershell -NoProfile -File tools/build.ps1 -UiTest"
